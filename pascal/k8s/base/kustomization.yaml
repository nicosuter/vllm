apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base manifests, deliberately free of site-specific values. Applying this
# directly (kubectl apply -k pascal/k8s/base) works only if the cluster's default StorageClass is acceptable and
# every node advertising nvidia.com/gpu is Pascal. Otherwise apply an overlay
# that pins them -- see README.md.
resources:
  - build-pod.yaml
  - probe-job.yaml
